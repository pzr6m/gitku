name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test (dependency-free syllable counter)
        run: GITKU_NO_CMUDICT=1 pytest -q
      - name: Test (with CMU dictionary)
        run: |
          pip install -e ".[accurate]"
          pytest -q
      - name: Website engine tests
        if: matrix.python-version == '3.12'
        run: |
          node --test tests/web/gitku.test.mjs
          python scripts/sync_overrides.py --check
