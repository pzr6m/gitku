[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gitku"
version = "0.1.0"
description = "Find the accidental haiku hiding in your git history."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["git", "haiku", "poetry", "cli", "commit-messages", "fun"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
accurate = ["cmudict>=1.0"]
dev = ["pytest>=7"]

[project.scripts]
gitku = "gitku.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
